<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MysticDex - Mystic Messenger Companion App</title>
    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Main Mobile Container -->
    <div class="app-container">

        <!-- Glassmorphism Header -->
        <header class="app-header">
            <div class="logo-container">
                <div class="logo-icon">M</div>
                <h1 class="app-title">MysticDex</h1>
            </div>

            <!-- Dark Mode Toggle -->
            <button class="theme-toggle-btn" aria-label="Toggle dark mode" id="theme-toggle">
                <!-- Sun / Moon SVG dynamically loaded or defaults to Sun -->
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                </svg>
            </button>
        </header>

        <!-- Main Dynamic Content Area -->
        <main class="app-content">

            <!-- TAB 1: HOME -->
            <section id="tab-home" class="tab-content active">

                <!-- Navigation Quick Actions -->
                <h3 class="section-title">
                    <svg style="width: 18px; height: 18px; stroke: var(--primary); fill: none; stroke-width: 2;"
                        viewBox="0 0 24 24">
                        <path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round" />
                    </svg>
                    Quick Modules
                </h3>
                <div class="features-grid">
                    <button class="feature-card walkthrough-card">
                        <div class="feature-icon-wrapper">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                stroke="currentColor" style="width: 20px; height: 20px;">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
                            </svg>
                        </div>
                        <h4 class="feature-card-title">Walkthroughs</h4>
                        <p class="feature-card-desc">Schedules & choices</p>
                    </button>

                    <button class="feature-card email-card">
                        <div class="feature-icon-wrapper">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                stroke="currentColor" style="width: 20px; height: 20px;">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                            </svg>
                        </div>
                        <h4 class="feature-card-title">Email Guides</h4>
                        <p class="feature-card-desc">Guest answers</p>
                    </button>

                    <button class="feature-card tracker-card">
                        <div class="feature-icon-wrapper">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                stroke="currentColor" style="width: 20px; height: 20px;">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
                            </svg>
                        </div>
                        <h4 class="feature-card-title">Email Tracker</h4>
                        <p class="feature-card-desc">Tracked guests</p>
                    </button>
                </div>

                <!-- Real-time Game Progress Tracker Section -->
                <div class="tracker-section" id="game-progress-section" style="margin-bottom: 24px;">
                    <h3 class="section-title">
                        <svg style="width: 18px; height: 18px; stroke: var(--primary); fill: none; stroke-width: 2;"
                            viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="10" />
                            <polyline points="12 6 12 12 16 14" />
                        </svg>
                        Real-time Game Tracker
                    </h3>

                    <!-- Config Form Card -->
                    <div id="game-tracker-config"
                        style="background-color: var(--bg-container); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; gap: 12px; margin-bottom: 12px;">
                        <div style="font-size: 0.85rem; color: var(--text-secondary); font-weight: 500;">Set your start
                            date & time to track active chatrooms:</div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                            <div>
                                <label
                                    style="font-size: 0.75rem; color: var(--text-muted); font-weight: 600; display: block; margin-bottom: 4px;">START
                                    DATE</label>
                                <input type="date" id="tracker-start-date" class="search-input"
                                    style="padding: 8px 12px; font-size: 0.8rem; margin: 0;" />
                            </div>
                            <div>
                                <label
                                    style="font-size: 0.75rem; color: var(--text-muted); font-weight: 600; display: block; margin-bottom: 4px;">START
                                    TIME</label>
                                <input type="time" id="tracker-start-time" class="search-input"
                                    style="padding: 8px 12px; font-size: 0.8rem; margin: 0;" />
                            </div>
                        </div>
                        <div>
                            <label
                                style="font-size: 0.75rem; color: var(--text-muted); font-weight: 600; display: block; margin-bottom: 4px;">SELECT
                                GAME ROUTE</label>
                            <select id="tracker-route-select" class="search-input"
                                style="padding: 8px 12px; font-size: 0.8rem; margin: 0; appearance: auto;">
                                <option value="none">-- Select Route --</option>
                                <option value="Zen">Zen Route</option>
                                <option value="Yoosung">Yoosung Route</option>
                                <option value="Jaehee">Jaehee Route</option>
                                <option value="Jumin">Jumin Route</option>
                                <option value="707">707 Route</option>
                                <option value="V">V Route</option>
                                <option value="Ray">Ray Route</option>
                            </select>
                        </div>
                        <button id="save-tracker-config-btn"
                            style="background-color: var(--primary); color: white; border: none; padding: 10px; border-radius: var(--radius-md); font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: all 0.2s ease;">
                            Start Tracking
                        </button>
                    </div>

                    <!-- Live Progression Schedule Card -->
                    <div id="live-schedule-card"
                        style="display: none; background-color: var(--bg-container); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px; box-shadow: var(--shadow-sm); flex-direction: column; gap: 12px;">
                        <div
                            style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 8px;">
                            <div>
                                <span id="live-day-badge"
                                    style="background-color: var(--primary); color: white; font-size: 0.75rem; padding: 3px 8px; border-radius: 10px; font-weight: 700;">Day
                                    1</span>
                                <span id="live-route-badge"
                                    style="margin-left: 6px; font-size: 0.8rem; font-weight: 600; color: var(--text-primary);">Zen
                                    Route</span>
                            </div>
                            <div style="display: flex; align-items: center; gap: 8px;">
                                <button id="toggle-past-chats-btn"
                                    style="background: none; border: none; color: var(--text-secondary); font-size: 0.75rem; cursor: pointer; font-weight: 600; text-decoration: underline;">Show
                                    Past Chatrooms</button>
                                <button id="edit-tracker-config-btn"
                                    style="background: none; border: none; color: var(--primary); font-size: 0.75rem; cursor: pointer; font-weight: 600; text-decoration: underline;">Edit
                                    Start</button>
                            </div>
                        </div>

                        <!-- List of chatrooms -->
                        <div id="live-chatrooms-list"
                            style="display: flex; flex-direction: column; gap: 8px; max-height: 350px; overflow-y: auto; padding-right: 4px;">
                            <!-- Dynamically loaded -->
                        </div>
                    </div>
                </div>

            </section>

            <!-- TAB 2: WALKTHROUGH -->
            <section id="tab-walkthrough" class="tab-content">
                <!-- Sticky Header for Search & Route Filters -->
                <div class="walkthrough-sticky-header">
                    <!-- Search Bar -->
                    <div class="search-wrapper" style="margin-bottom: 0;">
                        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                        <input type="text" class="search-input" id="search-walkthrough"
                            placeholder="Search walkthrough chatrooms...">
                        <button class="clear-search-btn" id="clear-walkthrough-search" type="button" style="display: none;">&times;</button>
                    </div>

                    <!-- Route Filter Chips list -->
                    <div class="route-list-container">
                        <div class="route-list" id="route-chips-list">
                            <!-- Loaded dynamically -->
                        </div>
                    </div>
                </div>

                <!-- Walkthrough Content List -->
                <div id="walkthroughs-list">
                    <!-- Rendered dynamically -->
                </div>
            </section>

            <!-- TAB 3: EMAILS -->
            <section id="tab-emails" class="tab-content">
                <!-- Search Bar -->
                <div class="search-wrapper">
                    <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                    <input type="text" class="search-input" id="search-emails"
                        placeholder="Search email guest or answer keys...">
                    <button class="clear-search-btn" id="clear-emails-search" type="button" style="display: none;">&times;</button>
                </div>

                <!-- Emails Content List -->
                <div id="emails-list" class="email-list">
                    <!-- Rendered dynamically -->
                </div>
            </section>

            <!-- TAB 4: EMAIL TRACKER -->
            <section id="tab-tracker" class="tab-content">
                <div class="tracker-section" id="email-tracker-section" style="margin-top: 10px;">
                    <div class="tracker-header"
                        style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                        <h3 class="section-title" style="margin: 0; display: flex; align-items: center; gap: 8px;">
                            <svg style="width: 18px; height: 18px; stroke: var(--accent-pink); fill: none; stroke-width: 2;"
                                viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
                            </svg>
                            Email Tracker
                        </h3>
                        <button class="tracker-reset-btn" id="reset-tracker-btn"
                            style="background: none; border: none; color: var(--text-muted); font-size: 0.8rem; cursor: pointer; font-weight: 600; text-decoration: underline; transition: color 0.2s;"
                            onmouseover="this.style.color='var(--accent-pink)'"
                            onmouseout="this.style.color='var(--text-muted)'">Reset All</button>
                    </div>
                    <div id="tracker-list" class="email-list" style="margin-bottom: 24px;">
                        <!-- Loaded dynamically -->
                    </div>
                </div>
            </section>

        </main>

        <!-- Sticky Bottom Navigation Bar -->
        <nav class="bottom-nav">
            <button class="nav-item active" data-tab="home" aria-label="Navigate to Home">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                </svg>
                <span>Home</span>
            </button>
            <button class="nav-item" data-tab="walkthrough" aria-label="Navigate to Walkthrough">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
                </svg>
                <span>Walkthrough</span>
            </button>
            <button class="nav-item" data-tab="emails" aria-label="Navigate to Email Guide">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                </svg>
                <span>Emails</span>
            </button>
            <button class="nav-item" data-tab="tracker" aria-label="Navigate to Email Tracker">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
                </svg>
                <span>Tracker</span>
            </button>
        </nav>

    </div>

    <!-- jQuery library CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <!-- SQL.js SQLite WASM -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    <!-- Application Logic -->
    <script src="app.js"></script>
</body>

</html>
